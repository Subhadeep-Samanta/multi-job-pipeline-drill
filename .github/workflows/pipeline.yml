name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Unit tests must wait for lint to pass first.
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Build must wait for lint to pass first.
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Integration tests require the successful application build.
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist/

      - run: npm run test:integration

  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Staging requires both unit tests and integration tests to succeed.
    needs: [unit-tests, integration-tests]

    if: github.ref == 'refs/heads/main'

    steps:
      - run: echo "Deploying to staging environment"

  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Production must wait for staging deployment to succeed.
    needs: deploy-staging

    if: github.ref == 'refs/heads/main'

    steps:
      - run: echo "Deploying to production environment"

  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: always()

    steps:
      - run: echo "Pipeline notification sent"